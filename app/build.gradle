plugins {
    id 'com.android.application'
}

android {
    namespace 'app.kazancdefteri'
    compileSdk 34

    defaultConfig {
        applicationId 'app.kazancdefteri'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        release {
            storeFile file('release.keystore')
            storePassword 'kazanc2026'
            keyAlias 'kazanc'
            keyPassword 'kazanc2026'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
